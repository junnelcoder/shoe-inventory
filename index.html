<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sole Ledger — Nike Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0f0d;
    --panel:#16180f;
    --panel-2:#1c1e14;
    --line:#2b2e20;
    --volt:#d7f13a;
    --orange:#ff5a1f;
    --text:#f2f2e9;
    --text-dim:#9a9c8c;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, rgba(215,241,58,0.08), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(255,90,31,0.07), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Archivo',sans-serif;
    min-height:100vh;
    padding-bottom:80px;
  }
  ::selection{background:var(--volt);color:#0e0f0d;}

  header{
    padding:36px 5vw 24px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:20px;
  }
  .brand-eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--volt);
    margin:0 0 8px;
    font-weight:600;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(38px,6vw,72px);
    line-height:.9;
    margin:0;
    letter-spacing:.01em;
  }
  h1 span{color:var(--text-dim);}
  .stats{display:flex;gap:28px;text-align:right;}
  .stat-num{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--volt);line-height:1;}
  .stat-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);margin-top:4px;}

  .toolbar{padding:20px 5vw;}
  .search-wrap{position:relative;max-width:420px;}
  .search-wrap input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 14px;
    font-family:'Archivo',sans-serif;
    font-size:13px;
    border-radius:var(--radius);
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--volt);}
  .search-wrap input::placeholder{color:var(--text-dim);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:18px;
    padding:0 5vw 40px;
  }
  .empty-state{
    margin:60px 5vw;
    text-align:center;
    color:var(--text-dim);
    border:1px dashed var(--line);
    padding:60px 20px;
    border-radius:var(--radius);
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg,var(--volt),var(--orange));
    opacity:0;
    transition:opacity .15s ease;
  }
  .card:hover::before{opacity:1;}

  .card-media{
    position:relative;
    aspect-ratio:4/3;
    background:linear-gradient(160deg, var(--panel-2), #101208);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .card-media img{width:100%;height:100%;object-fit:cover;display:block;}
  .media-fallback{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-dim);}
  .media-fallback svg{width:56px;height:56px;opacity:.5;}
  .media-fallback span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;}

  .card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1;}
  .card-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.01em;line-height:1.05;}
  .card-tag{display:inline-block;margin-top:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);font-weight:700;}
  .qty-total{text-align:right;flex-shrink:0;}
  .qty-total b{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--volt);display:block;line-height:1;}
  .qty-total small{font-size:9px;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;}
  .qty-total.out b{color:var(--text-dim);}

  table.sizes{width:100%;border-collapse:collapse;font-size:12px;}
  table.sizes th{
    text-align:left;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--text-dim);font-weight:600;padding:0 6px 6px 0;border-bottom:1px solid var(--line);
  }
  table.sizes td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);}
  table.sizes tr:last-child td{border-bottom:none;}
  table.sizes tr.oos td{color:var(--text-dim);}
  .qty-badge{font-weight:700;text-align:right;display:block;}
  .qty-badge.zero{color:var(--text-dim);font-weight:500;}

  footer{text-align:center;color:var(--text-dim);font-size:11px;letter-spacing:.06em;padding:30px 20px 10px;}

  @media (max-width:520px){
    .stats{gap:18px;}
    .stat-num{font-size:26px;}
  }
</style>
</head>
<body>

<header>
  <div>
    <p class="brand-eyebrow">Private Stock · Rotation Ledger</p>
    <h1>SOLE <span>LEDGER</span></h1>
  </div>
  <div class="stats">
    <div><div class="stat-num" id="statModels">0</div><div class="stat-label">Models</div></div>
    <div><div class="stat-num" id="statPairs">0</div><div class="stat-label">Total Pairs</div></div>
    <div><div class="stat-num" id="statSizes">0</div><div class="stat-label">Size Slots</div></div>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Search model, colorway...">
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="empty-state" id="emptyState" style="display:none;">No shoes match your search.</div>

<footer>Catalog view · photos loaded from /images · updated by the shop admin</footer>

<template id="fallbackTemplate"><div class="media-fallback">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M2 17l2-2 3 2 3-3 3 3 3-3 3 3 3-2v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-3z"/>
    <path d="M2 17c0-2 1-4 3-5l2-4c1-2 3-3 5-3h2c1 0 2 .5 2.5 1.5L18 10c2 .5 4 2 4 4"/>
  </svg>
  <span>No image yet</span>
</div></template>

<script src="data.js"></script>
<script>
const IMG_EXT_FALLBACKS = ['jpeg','png','webp','JPG','PNG'];

function handleImgError(img){
  let idx = parseInt(img.dataset.extIdx || '0', 10);
  if(idx < IMG_EXT_FALLBACKS.length){
    img.dataset.extIdx = String(idx + 1);
    img.src = 'images/' + img.dataset.slug + '.' + IMG_EXT_FALLBACKS[idx];
  } else {
    img.onerror = null;
    const fb = document.createElement('div');
    fb.className = 'media-fallback';
    fb.innerHTML = document.getElementById('fallbackTemplate').innerHTML;
    img.replaceWith(fb);
  }
}
window.handleImgError = handleImgError;

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let inventory = [];
let searchTerm = '';

const grid = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');

function render(){
  grid.innerHTML = '';
  const term = searchTerm.trim().toLowerCase();
  const filtered = inventory.filter(p => p.name.toLowerCase().includes(term));
  emptyState.style.display = filtered.length ? 'none' : 'block';

  filtered.forEach(product => {
    const card = document.createElement('div');
    card.className = 'card';

    const totalQty = product.sizes.reduce((sum,s) => sum + Number(s.qty||0), 0);

    card.innerHTML = `
      <div class="card-media">
        <img src="images/${product.slug}.jpg" alt="${escapeHtml(product.name)}" data-slug="${product.slug}" data-ext-idx="0" onerror="handleImgError(this)">
      </div>
      <div class="card-body">
        <div class="card-title-row">
          <div>
            <div class="card-title">${escapeHtml(product.name)}</div>
            <span class="card-tag">${product.sizes.length} size${product.sizes.length===1?'':'s'} tracked</span>
          </div>
          <div class="qty-total ${totalQty===0?'out':''}">
            <b>${totalQty}</b>
            <small>in stock</small>
          </div>
        </div>
        <table class="sizes">
          <thead><tr><th>US</th><th>UK</th><th>EUR</th><th>CM</th><th style="text-align:right;">Qty</th></tr></thead>
          <tbody>
            ${product.sizes.map(s => `
              <tr class="${Number(s.qty)===0?'oos':''}">
                <td>${escapeHtml(s.us)}</td>
                <td>${escapeHtml(s.uk)}</td>
                <td>${escapeHtml(s.eur)}</td>
                <td>${escapeHtml(s.cm)}</td>
                <td><span class="qty-badge ${Number(s.qty)===0?'zero':''}">${s.qty===0?'Out':s.qty}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
    grid.appendChild(card);
  });

  document.getElementById('statModels').textContent = inventory.length;
  document.getElementById('statPairs').textContent = inventory.reduce((sum,p)=> sum + p.sizes.reduce((s2,sz)=>s2+Number(sz.qty||0),0), 0);
  document.getElementById('statSizes').textContent = inventory.reduce((sum,p)=> sum + p.sizes.length, 0);
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

/* Load published data: inventory.json (written by the admin page) takes
   priority; if it's missing (e.g. not published yet) fall back to the
   built-in starter catalog from data.js. */
fetch('inventory.json', { cache: 'no-store' })
  .then(res => { if(!res.ok) throw new Error('no inventory.json'); return res.json(); })
  .then(json => { inventory = normalizeInventory(json); render(); })
  .catch(() => { inventory = buildDefaultInventory(); render(); });
</script>
</body>
</html>
